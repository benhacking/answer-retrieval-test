[project]
name = "cant-make-it-up"
version = "0.1.0"
description = "Do cheap LLMs invent 'exact quotes'? A small test on fresh documents, scored with a substring check."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.15.0",
    "datasets>=4.0.0",
    "lxml>=6.1.3",
    "matplotlib>=3.10.9",
    "openai>=3.51.0",
    "pandas>=2.3.3",
    "perplexityai>=0.44.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]
